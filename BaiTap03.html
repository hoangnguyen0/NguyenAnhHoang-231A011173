<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3: Đồng hồ đếm ngược</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bài 3: Đồng hồ đếm ngược</h1>
  </header>
  <nav><!-- Menu tương tự --></nav>
  <main>
    <section>
      <h2 id="timer">10:00</h2>
    </section>
  </main>
  <script>
    let time = 600; // 10 phút (600 giây)
    const timerElement = document.getElementById('timer');
    const interval = setInterval(() => {
      time--;
      const min = Math.floor(time / 60).toString().padStart(2, '0');
      const sec = (time % 60).toString().padStart(2, '0');
      timerElement.textContent = `${min}:${sec}`;

      if (time < 60) timerElement.classList.add('warning'); // Animation dưới 1 phút
      if (time <= 0) {
        clearInterval(interval); // Tránh leak
        alert('Hết thời gian!');
      }
    }, 1000);
  </script>
</body>
</html>
